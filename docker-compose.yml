version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7
    container_name: creators-platform-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - creators-network

  # Node.js/Express Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: creators-platform-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/creators-platform?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - creators-network

  # React Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: creators-platform-client
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - server
    networks:
      - creators-network

# Named volume for MongoDB persistence
volumes:
  mongo-data:
    driver: local

# Docker network for service communication
networks:
  creators-network:
    driver: bridge
